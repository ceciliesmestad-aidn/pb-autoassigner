# Config used by the GitHub Actions daily run (.github/workflows/daily-run.yml).
# Contains NO secrets — PB token, Anthropic key, and Slack webhook come from
# GitHub repo secrets via env vars (PB_TOKEN, ANTHROPIC_API_KEY,
# SLACK_WEBHOOK_URL). Safe to commit.

[productboard]
token = ""              # from env PB_TOKEN
ssl_verify = true       # no corporate proxy in GitHub's cloud
patch_delay_seconds = 0.3
api_version = "v2"      # v1 sunsets 2026-07-08
workspace = "aidn"      # used to build UI links in Slack notifications

[anthropic]
api_key = ""            # from env ANTHROPIC_API_KEY
model_default = "claude-haiku-4-5-20251001"
model_escalate = "claude-sonnet-4-6"
escalate_below = 0.6
batch_size = 10
ssl_verify = true

[classifier]
needs_attention_below = 0.6
autopilot_min_confidence = 0.5
autopilot_enabled = true
autopilot_dry_run = false   # LIVE — assignments are PATCHed to Productboard
autopilot_per_pm_cap = 20
autopilot_total_cap = 200
tag_team_on_assign = true   # add PM's team name as tag on assigned notes

[training]
window_days = 180
min_notes_per_pm = 5

[slack]
webhook_url = ""        # from env SLACK_WEBHOOK_URL
enabled = true
ssl_verify = true

[tender_watchdog]
enabled = true
# Who owns the UI-only steps (create the date field, add the board column, add
# the board filter). Cecilie while testing; to be reassigned — see the Slack
# thread in #team-product-operations 2026-09-07.
owner_mention = "<@U08GRQK3EH4>"

[zendesk]
# PB -> Zendesk transfer. Credentials come from GitHub secrets
# ZENDESK_OPERATOR_OAUTH_CLIENT_ID / _SECRET. Flip to true only after a clean
# local dry-run and one verified live transfer.
enabled = false
base_url = "https://aidnsupport.zendesk.com"
oauth_client_id = ""        # from env ZENDESK_OPERATOR_OAUTH_CLIENT_ID
oauth_client_secret = ""    # from env ZENDESK_OPERATOR_OAUTH_CLIENT_SECRET
oauth_scope = "read write"
pb_owner_email = "torstein.bore@aidn.no"
trigger_tag = "send-to-zendesk"
completed_tag = "sent-to-zendesk"
ticket_tag = "from_productboard"
group_id = 0
ssl_verify = true
max_per_run = 50

[server]
host = "127.0.0.1"
port = 8765

[storage]
db_path = "data/pb_assigner.db"
scopes_dir = "scopes"
