# Scope: Jens Aga Malm — Team Back Office
# Notes are in Norwegian (may contain English terms). Do not translate.
# 2026-08-12: Rapportering/analyse/statistikk/KOSTRA/Power BI/Aidn Analytics
# flyttet til Séamus Beirne (Team Data & Analytics). Jens beholder økonomi,
# plassadministrasjon og hjelpemidler.

pm_email: jens.malm@aidn.no
pm_name: Jens Aga Malm
team: Team Back Office

description_no: |
  Jens eier back-office: økonomi, faktura, arbeidsflyter for administrasjon.
  Inkluderer også plassadministrasjon (sengeoversikt, rom, belegg, institusjon),
  egenbetaling/egenandel, hjelpemidler (KS Hjelpemidler-integrasjon),
  og økonomiintegrasjoner (Xledger, Helfo, NAV-trekklister).
  Rapportering, analyse, statistikk og Aidn Analytics eies av Séamus
  (Team Data & Analytics) — Jens har kun rapport-saker der økonomi er kjernen
  (f.eks. fakturagrunnlag, refusjon).

includes:
  - Faktura, fakturering, fakturaflyt, fakturagrunnlag, kreditering
  - Egenbetaling, egenandel, egenandelsgrunnlag, ligningstall, bofradrag, kurdøgnpris
  - Etteroppgjør, kontrolloppgjør, trekklister fra NAV
  - Arbeidsflyter for administrasjon (kombinert med faktura → Jens)
  - Plassadministrasjon (rom, senger, belegg, institusjon, HDO, omsorgsboliger)
  - Hjelpemidler, KS Hjelpemidler, KS Påkobla, hjelpemiddellager
  - Økonomiintegrasjoner: Xledger, Helfo REST-API, KS Fiks API, NAV-integrasjon
  - Varsling ved endring i egenandelsgrunnlag / ligningstall
  - Ressurskrevende tjenestemottakere (refusjonsordningen)
  - Pasientregnskap / lommepenger
  - Diettkoder og matombringing (der det danner grunnlag for fakturering)
  - Automatisk taksting til HELFO (fysioterapi)

excludes:
  - Rapportering, analyse, statistikk, KOSTRA/KPR/IPLOS → Séamus (Data & Analytics)
  - Aidn Analytics, dashboards, Power BI, styringsinformasjon → Séamus (Data & Analytics)
  - Rapport i sykepleie-/vakt-kontekst  → Line (CPR)
  - Meldingsintegrasjoner               → Hanne (Messaging)
  - Plassadministrasjon som ren klinisk/logistisk saksbehandling uten økonomi/belegg-kontekst → vurder CPR

tag_routes:
  - "team back office"

keywords_strong:
  - faktur
  - egenbetaling
  - egenandel
  - ligningstall
  - bofradrag
  - kurdøgnpris
  - etteroppgjør
  - plassadministrasjon
  - sengeoversikt
  - belegg
  - xledger
  - helfo
  - hjelpemidler
  - ks hjelpemidler
  - ressurskrevende
  - lommepenger
  - trekkliste

disambiguations:
  - term: rapport
    route_here_when:
      - fakturagrunnlag
      - egenbetaling
      - refusjon
      - ressurskrevende
    route_elsewhere_when:
      - kostra, statistikk, styringsinformasjon, dashboard, aidn analytics, powerbi → seamus.beirne@aidn.no (Data & Analytics)
      - natt, sykepleie, vakt, overlevering → line.adde@aidn.no (CPR)
  - term: faktura + arbeidsflyt
    route_here_always: true
    why: "Faktura i kombinasjon med arbeidsflyt er Back Office, ikke AI/Automation."
  - term: plassadministrasjon
    route_here_when:
      - belegg
      - rom
      - seng
      - institusjon
      - hdo
      - omsorgsbolig
      - fakturagrunnlag
      - overlappende opphold
    why: "Plassadministrasjon med økonomi/belegg-kontekst tilhører Back Office."
  - term: hjelpemidler
    route_here_when:
      - ks hjelpemidler
      - ks påkobla
      - hjelpemiddellager
      - integrasjon
      - nav hjelpemiddelsentral
    why: "Hjelpemiddelintegrasjon (KS Hjelpemidler) eies av Back Office."

hard_negatives:
  - "rapportskjema i sykepleie/vakt-kontekst → CPR/Line"
  - "rene analyse-/statistikk-/dashboardsaker → Séamus (Data & Analytics)"
  - "plassadministrasjon uten økonomi/belegg-vinkel og med ren klinisk kontekst → vurder CPR"
